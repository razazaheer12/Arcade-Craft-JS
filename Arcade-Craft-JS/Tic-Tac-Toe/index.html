<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="frame">
      <header class="title-block">
        <h1 class="game-title">
          <span class="word blue">Tic</span>
          <span class="word white">Tac</span>
          <span class="word red">Toe</span>
        </h1>
        <div class="subtitle-banner">
          <span class="white">Classic Game</span>
          <span class="red">Reimagined</span>
        </div>
      </header>

      <div class="content">
        <ul class="feature-list">
          <li class="feature">
            <span class="feature-icon blue">
              <svg viewBox="0 0 24 24" fill="none">
                <circle
                  cx="9"
                  cy="8"
                  r="3"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <circle
                  cx="16"
                  cy="9"
                  r="2.4"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
                <path
                  d="M3.5 19c.6-3.4 3-5 5.5-5s4.9 1.6 5.5 5"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
                <path
                  d="M14.5 14.3c2 .2 3.7 1.7 4.2 4.7"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <div>
              <strong class="blue">Two-player</strong>
              <p>Turn-based gameplay</p>
            </div>
          </li>

          <li class="feature">
            <span class="feature-icon red">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M7 4h10v3a5 5 0 0 1-10 0V4z"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />
                <path
                  d="M7 5H4a3 3 0 0 0 3 3M17 5h3a3 3 0 0 1-3 3"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
                <path
                  d="M9 17h6M12 13v4M9 20h6"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <div>
              <strong class="red">Automatic</strong>
              <p>Win / draw detection</p>
            </div>
          </li>

          <li class="feature">
            <span class="feature-icon blue">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <div>
              <strong class="blue">Real-time</strong>
              <p>Event handling</p>
            </div>
          </li>

          <li class="feature">
            <span class="feature-icon red">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M3 12a9 9 0 1 1 3 6.7"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <path
                  d="M3 8v5h5"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <div>
              <strong class="red">Instant</strong>
              <p>Restart</p>
            </div>
          </li>
        </ul>

        <div class="game-panel">
          <p class="status" id="status">
            Player <span class="x-color">X</span>'s turn
          </p>

          <div class="board-wrap">
            <div class="board" id="board">
              <button class="cell" data-index="0" aria-label="Cell 1"></button>
              <button class="cell" data-index="1" aria-label="Cell 2"></button>
              <button class="cell" data-index="2" aria-label="Cell 3"></button>
              <button class="cell" data-index="3" aria-label="Cell 4"></button>
              <button class="cell" data-index="4" aria-label="Cell 5"></button>
              <button class="cell" data-index="5" aria-label="Cell 6"></button>
              <button class="cell" data-index="6" aria-label="Cell 7"></button>
              <button class="cell" data-index="7" aria-label="Cell 8"></button>
              <button class="cell" data-index="8" aria-label="Cell 9"></button>
            </div>
            <div class="win-line" id="win-line"></div>
          </div>

          <div class="scoreboard">
            <div class="score-chip x">
              <span class="score-label">Player X</span>
              <span class="score-value" id="score-x">0</span>
            </div>
            <div class="score-chip draw">
              <span class="score-label">Draws</span>
              <span class="score-value" id="score-draw">0</span>
            </div>
            <div class="score-chip o">
              <span class="score-label">Player O</span>
              <span class="score-value" id="score-o">0</span>
            </div>
          </div>

          <button class="restart-btn" id="restart-btn">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M3 12a9 9 0 1 1 3 6.7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M3 8v5h5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Restart Round
          </button>
        </div>
      </div>

      <p class="tagline">
        Simple rules. <span class="blue">Endless fun.</span>
        <span class="red">Timeless game.</span>
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
